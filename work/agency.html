<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agency Website — Under Production</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-solid: #050505;
    --accent: #b5ff4d;
    --accent2: #00e5ff;
    --text: #f0f0f0;
    --muted: #888;
    --border: rgba(255, 255, 255, 0.08);
  }

  body {
    background: var(--bg-solid);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* --- Futuristic Background --- */
  .bg-container {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 0;
    perspective: 1000px;
    opacity: 0.8;
  }

  .circle {
    position: absolute;
    border-radius: 50%;
    transform-style: preserve-3d;
  }

  /* Circle 1: Large outer dashed ring */
  .circle-1 {
    width: 65vw;
    height: 65vw;
    max-width: 800px;
    max-height: 800px;
    border: 1px dashed rgba(0, 229, 255, 0.3);
    animation: rotate1 40s linear infinite;
  }

  /* Circle 2: Off-axis glowing gradient ring */
  .circle-2 {
    width: 50vw;
    height: 50vw;
    max-width: 600px;
    max-height: 600px;
    border: 2px solid transparent;
    border-top: 2px solid var(--accent);
    border-bottom: 2px solid var(--accent2);
    filter: drop-shadow(0 0 15px rgba(181, 255, 77, 0.4));
    animation: rotate2 25s linear infinite;
  }

  /* Circle 3: Figma-style morphing geometric blob */
  .circle-3 {
    width: 35vw;
    height: 35vw;
    max-width: 450px;
    max-height: 450px;
    background: linear-gradient(135deg, rgba(181, 255, 77, 0.05), rgba(0, 229, 255, 0.1));
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
    backdrop-filter: blur(10px);
    animation: rotate3 20s ease-in-out infinite alternate;
  }

  /* Circle 4: Inner fast-spinning tech dotted ring */
  .circle-4 {
    width: 25vw;
    height: 25vw;
    max-width: 300px;
    max-height: 300px;
    border: 2px dotted rgba(181, 255, 77, 0.5);
    animation: rotate4 15s linear infinite;
  }

  /* Background Grid overlay for extra tech vibe */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 1;
    pointer-events: none;
  }

  @keyframes rotate1 {
    0% { transform: rotateZ(0deg); }
    100% { transform: rotateZ(360deg); }
  }
  @keyframes rotate2 {
    0% { transform: rotateX(60deg) rotateY(20deg) rotateZ(0deg); }
    100% { transform: rotateX(60deg) rotateY(20deg) rotateZ(-360deg); }
  }
  @keyframes rotate3 {
    0% { transform: rotate(0deg) scale(1); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
    50% { transform: rotate(180deg) scale(1.05); border-radius: 60% 40% 30% 70% / 50% 60% 50% 40%; }
    100% { transform: rotate(360deg) scale(1); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
  }
  @keyframes rotate4 {
    0% { transform: rotateY(45deg) rotateX(-20deg) rotateZ(0deg); }
    100% { transform: rotateY(45deg) rotateX(-20deg) rotateZ(360deg); }
  }

  /* --- Content Card --- */
  .content-wrapper {
    position: relative;
    z-index: 10;
    animation: floatingHover 6s ease-in-out infinite;
    padding: 20px;
  }

  @keyframes floatingHover {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .glass-card {
    background: rgba(10, 10, 10, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 3.5rem 3rem;
    max-width: 580px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 229, 255, 0.08);
    border: 1px solid rgba(0, 229, 255, 0.2);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 11px;
    color: var(--accent2);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  .tag::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--accent2);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2.5rem, 5vw, 3.5rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
    margin-bottom: 1.5rem;
  }

  .title span {
    color: var(--accent);
  }

  .description {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 2.5rem;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.3s;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
  }

  .back-link:hover {
    color: var(--accent);
    gap: 14px;
    border-bottom: 1px solid var(--accent);
  }

  .back-link .arrow {
    font-size: 16px;
    transition: transform 0.3s;
  }
  
  .back-link:hover .arrow {
    transform: translateX(-4px);
  }
</style>
</head>
<body>

  <!-- Background Grid -->
  <div class="grid-overlay"></div>

  <!-- Futuristic Rotating Circles -->
  <div class="bg-container">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
    <div class="circle circle-4"></div>
  </div>

  <!-- Main Content Card -->
  <div class="content-wrapper">
    <div class="glass-card">
      <div class="tag">Agency Website</div>
      <h1 class="title">Under<br><span>Production</span></h1>
      <p class="description">
        High-converting marketing site with CMS integration and 98 PageSpeed score. Delivered in 5 days.
      </p>
      <!-- Change href to your actual main index file path -->
      <a href="../index.html" class="back-link">
        <span class="arrow">←</span> Back to Portfolio
      </a>
    </div>
  </div>

</body>
</html>

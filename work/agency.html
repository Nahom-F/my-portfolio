<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agency Website — Under Production</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-solid: #02070d; /* Deep space navy */
    --text-green: #00ff66; /* Vibrant neon green */
    --text-white: #f4f4f5;
    
    /* Complementary non-green colors for layers */
    --accent-cyan: #00e5ff;
    --accent-blue: #2a81ff;
    --accent-silver: #e0e6ed;
  }

  body {
    background: var(--bg-solid);
    color: var(--text-white);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    background: radial-gradient(circle at center, #04101e 0%, #010306 100%);
  }

  /* --- ORBITAL SYSTEM CONTAINER --- */
  .orbital-system {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    transform-style: preserve-3d;
  }

  /* =========================================
     LAYER 3: SHAPE-SHIFTING ZIG-ZAG SPHERE
     ========================================= */
  .layer-3-zigzag {
    position: absolute;
    width: 800px;
    height: 800px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    animation: spinSlow 40s linear infinite;
  }

  /* SVG wrapper for the distorted lines */
  .zigzag-svg {
    position: absolute;
    width: 100%;
    height: 100%;
    opacity: 0.4;
  }

  .zigzag-circle {
    fill: none;
    stroke: var(--accent-cyan);
    stroke-width: 2;
    /* This filter makes the line chaotic, shape-shifting, and zig-zagged */
    filter: url(#zigzag-distortion);
    transform-origin: center;
  }
  .zc-1 { transform: rotateX(60deg) rotateY(20deg); animation: pulseDistortion 10s infinite alternate; }
  .zc-2 { transform: rotateX(-45deg) rotateY(60deg); animation: pulseDistortion 12s infinite alternate-reverse; }
  .zc-3 { transform: rotateX(30deg) rotateY(-70deg); animation: pulseDistortion 8s infinite alternate; }

  /* Intensely bright hovering dots on the outer layer */
  .bright-dot {
    position: absolute;
    border-radius: 50%;
    background: #ffffff;
    /* Super high glow */
    box-shadow: 0 0 15px #fff, 0 0 30px var(--accent-cyan), 0 0 45px var(--accent-cyan);
    top: 50%; left: 50%;
  }

  .bd-1 { width: 8px; height: 8px; animation: orbitDot1 15s linear infinite; }
  .bd-2 { width: 12px; height: 12px; animation: orbitDot2 20s linear infinite; }
  .bd-3 { width: 5px; height: 5px; animation: orbitDot3 12s linear infinite; }
  .bd-4 { width: 10px; height: 10px; animation: orbitDot4 25s linear infinite; box-shadow: 0 0 15px #fff, 0 0 30px var(--accent-blue); }

  /* =========================================
     LAYER 2: 3D DONUT SWIRL BALLS
     ========================================= */
  .layer-2-swirl {
    position: absolute;
    width: 600px;
    height: 600px;
    animation: spinSwirl 30s linear infinite;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .swirl-arm {
    position: absolute;
    width: 100%;
    height: 100%;
  }
  
  /* Opposite arm flipped */
  .swirl-arm-2 {
    transform: rotate(180deg);
  }

  /* The actual 3D balls in the swirl */
  .swirl-ball {
    position: absolute;
    top: 50%; left: 50%;
    /* Create a 3D sphere look */
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff 0%, #888888 40%, #111111 90%);
    box-shadow: 0 0 10px rgba(0,0,0,0.8);
    
    /* Calculate size, rotation, and distance for a perfect spiral using CSS variables */
    width: calc(18px - (var(--i) * 0.45px));
    height: calc(18px - (var(--i) * 0.45px));
    margin-top: calc((18px - (var(--i) * 0.45px)) / -2);
    margin-left: calc((18px - (var(--i) * 0.45px)) / -2);
    
    transform: rotate(calc(var(--i) * -18deg)) translateX(calc(120px + (var(--i) * 7px)));
    
    /* Dynamic color/brightness changing animation */
    animation: colorShift 4s infinite alternate ease-in-out;
    animation-delay: calc(var(--i) * -0.3s);
  }

  /* =========================================
     LAYER 1: GLOWING ATOM (Maintained)
     ========================================= */
  .layer-1-atom {
    position: absolute;
    width: 250px;
    height: 250px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    animation: floatAtom 6s ease-in-out infinite;
  }

  .atom-core {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff 0%, #a3cdff 20%, #2a81ff 60%, #001233 100%);
    box-shadow: 0 0 40px rgba(42, 129, 255, 0.8), inset -10px -10px 20px rgba(0,0,0,0.6);
    z-index: 5;
  }

  .atom-ring {
    position: absolute;
    width: 240px;
    height: 90px;
    border: 4px solid rgba(120, 185, 255, 0.9);
    border-radius: 50%;
    box-shadow: 0 0 20px var(--accent-blue), inset 0 0 20px var(--accent-blue);
  }
  
  .ring-1 { transform: rotateZ(45deg) rotateX(75deg); animation: spinRing1 12s linear infinite; }
  .ring-2 { transform: rotateZ(-45deg) rotateX(75deg); animation: spinRing2 12s linear infinite reverse; }

  .electron {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 20px #fff, 0 0 40px var(--accent-cyan);
  }
  .e-1 { top: -5px; left: 50%; transform: translateX(-50%); }
  .e-2 { bottom: -5px; left: 50%; transform: translateX(-50%); }

  /* --- ANIMATIONS --- */
  @keyframes spinSlow { 100% { transform: rotate(360deg); } }
  @keyframes spinSwirl { 100% { transform: rotate(-360deg); } }
  @keyframes floatAtom { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  @keyframes spinRing1 { 100% { transform: rotateZ(45deg) rotateX(75deg) rotateZ(360deg); } }
  @keyframes spinRing2 { 100% { transform: rotateZ(-45deg) rotateX(75deg) rotateZ(360deg); } }
  
  /* Creates the dark -> light dark -> white dark -> pure white pulsing effect on balls */
  @keyframes colorShift {
    0%   { filter: brightness(0.2) contrast(1.5); }
    33%  { filter: brightness(0.7) contrast(1.2); }
    66%  { filter: brightness(1.2) contrast(1); }
    100% { filter: brightness(2) contrast(0.8) drop-shadow(0 0 8px rgba(255,255,255,0.8)); }
  }

  /* Orbits for the super bright dots */
  @keyframes orbitDot1 { 100% { transform: rotate(360deg) translateX(350px) rotate(-360deg) translateY(100px); } }
  @keyframes orbitDot2 { 100% { transform: rotate(-360deg) translateX(400px) rotate(360deg) translateY(-150px); } }
  @keyframes orbitDot3 { 100% { transform: rotateX(60deg) rotateZ(360deg) translateX(280px); } }
  @keyframes orbitDot4 { 100% { transform: rotateY(70deg) rotateZ(-360deg) translateX(380px); } }

  /* Subtle pulsing to the zig zag lines */
  @keyframes pulseDistortion {
    0% { opacity: 0.2; }
    100% { opacity: 0.6; }
  }


  /* --- TEXT CONTENT (Green & Readable) --- */
  .content-wrapper {
    position: relative;
    z-index: 10;
    text-align: center;
    max-width: 600px;
    padding: 20px;
    /* Extreme dark shadow to separate neon text from glowing background elements */
    text-shadow: 
      0 4px 15px rgba(0, 0, 0, 1), 
      0 0 30px rgba(0, 0, 0, 1),
      0 2px 4px rgba(0, 0, 0, 1);
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 255, 102, 0.05);
    border: 1px solid rgba(0, 255, 102, 0.2);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 11px;
    color: var(--text-green);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 2rem;
    backdrop-filter: blur(4px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }

  .tag::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--text-green);
    border-radius: 50%;
    animation: pulseTag 2s infinite;
  }

  @keyframes pulseTag {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px var(--text-green); }
    50% { opacity: 0.4; transform: scale(0.8); box-shadow: 0 0 0px var(--text-green); }
  }

  .title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(3rem, 6vw, 5.5rem);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin-bottom: 1.5rem;
    color: var(--text-white);
  }

  /* Highlighting the word in green */
  .title span {
    color: var(--text-green);
  }

  .description {
    color: var(--accent-silver);
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 2.5rem;
    font-weight: 400;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--text-white);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.3s;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
  }

  .back-link:hover {
    color: var(--text-green);
    gap: 14px;
    border-bottom: 1px solid var(--text-green);
  }

  .back-link .arrow {
    font-size: 16px;
    transition: transform 0.3s;
  }
  
  .back-link:hover .arrow {
    transform: translateX(-4px);
  }
</style>
</head>
<body>

  <div class="orbital-system">
    
    <!-- Layer 3: Zig-Zag shape-shifting sphere & Super bright dots -->
    <div class="layer-3-zigzag">
      
      <!-- Bright Hovering Dots -->
      <div class="bright-dot bd-1"></div>
      <div class="bright-dot bd-2"></div>
      <div class="bright-dot bd-3"></div>
      <div class="bright-dot bd-4"></div>

      <!-- SVG containing the turbulence filter for the zig-zag effect -->
      <svg class="zigzag-svg" viewBox="0 0 800 800">
        <defs>
          <filter id="zigzag-distortion" x="-20%" y="-20%" width="140%" height="140%">
            <!-- This creates the chaotic, unbounded zig-zag shape out of a standard circle -->
            <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="40" xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </defs>
        
        <!-- The shape-shifting rings -->
        <circle cx="400" cy="400" r="300" class="zigzag-circle zc-1" />
        <circle cx="400" cy="400" r="320" class="zigzag-circle zc-2" />
        <circle cx="400" cy="400" r="280" class="zigzag-circle zc-3" />
      </svg>
    </div>

    <!-- Layer 2: 3D Donut Swirl Balls changing colors -->
    <div class="layer-2-swirl">
      <!-- Spiral Arm 1 -->
      <div class="swirl-arm">
        <div class="swirl-ball" style="--i:1;"></div><div class="swirl-ball" style="--i:2;"></div>
        <div class="swirl-ball" style="--i:3;"></div><div class="swirl-ball" style="--i:4;"></div>
        <div class="swirl-ball" style="--i:5;"></div><div class="swirl-ball" style="--i:6;"></div>
        <div class="swirl-ball" style="--i:7;"></div><div class="swirl-ball" style="--i:8;"></div>
        <div class="swirl-ball" style="--i:9;"></div><div class="swirl-ball" style="--i:10;"></div>
        <div class="swirl-ball" style="--i:11;"></div><div class="swirl-ball" style="--i:12;"></div>
        <div class="swirl-ball" style="--i:13;"></div><div class="swirl-ball" style="--i:14;"></div>
        <div class="swirl-ball" style="--i:15;"></div><div class="swirl-ball" style="--i:16;"></div>
        <div class="swirl-ball" style="--i:17;"></div><div class="swirl-ball" style="--i:18;"></div>
        <div class="swirl-ball" style="--i:19;"></div><div class="swirl-ball" style="--i:20;"></div>
      </div>
      
      <!-- Spiral Arm 2 -->
      <div class="swirl-arm swirl-arm-2">
        <div class="swirl-ball" style="--i:1;"></div><div class="swirl-ball" style="--i:2;"></div>
        <div class="swirl-ball" style="--i:3;"></div><div class="swirl-ball" style="--i:4;"></div>
        <div class="swirl-ball" style="--i:5;"></div><div class="swirl-ball" style="--i:6;"></div>
        <div class="swirl-ball" style="--i:7;"></div><div class="swirl-ball" style="--i:8;"></div>
        <div class="swirl-ball" style="--i:9;"></div><div class="swirl-ball" style="--i:10;"></div>
        <div class="swirl-ball" style="--i:11;"></div><div class="swirl-ball" style="--i:12;"></div>
        <div class="swirl-ball" style="--i:13;"></div><div class="swirl-ball" style="--i:14;"></div>
        <div class="swirl-ball" style="--i:15;"></div><div class="swirl-ball" style="--i:16;"></div>
        <div class="swirl-ball" style="--i:17;"></div><div class="swirl-ball" style="--i:18;"></div>
        <div class="swirl-ball" style="--i:19;"></div><div class="swirl-ball" style="--i:20;"></div>
      </div>
    </div>

    <!-- Layer 1: Glowing Atom Core -->
    <div class="layer-1-atom">
      <!-- Neon Rings -->
      <div class="atom-ring ring-1"><div class="electron e-1"></div></div>
      <div class="atom-ring ring-2"><div class="electron e-2"></div></div>
      <!-- Metallic Core -->
      <div class="atom-core"></div>
    </div>

  </div>

  <!-- Main Content Layout (Green accented text) -->
  <div class="content-wrapper">
    <div class="tag">Agency Website</div>
    <h1 class="title">Under<br><span>Production</span></h1>
    <p class="description">
      High-converting marketing site with CMS integration and<br>98 PageSpeed score. Delivered in 5 days.
    </p>
    <a href="../index.html" class="back-link">
      <span class="arrow">←</span> Back to Portfolio
    </a>
  </div>

</body>
</html>

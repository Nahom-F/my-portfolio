<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agency Website — Under Production</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-solid: #050505;
    --accent: #b5ff4d;
    --accent2: #00e5ff;
    --text: #f0f0f0;
    --muted: #888;
  }

  body {
    background: var(--bg-solid);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* --- Background Grid --- */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 50px 50px;
    z-index: 0;
  }

  /* --- ORBITAL SYSTEM --- */
  .orbital-system {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
  }

  .orbit {
    position: absolute;
    border-radius: 50%;
  }

  /* Layer 1: The Core Ball with hovering particles */
  .layer-1-core {
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(0, 229, 255, 0.15) 0%, rgba(0, 0, 0, 0) 60%);
    box-shadow: inset 0 0 40px rgba(0, 229, 255, 0.05);
    animation: pulseCore 4s ease-in-out infinite alternate;
  }
  .core-particle {
    position: absolute;
    border-radius: 50%;
    background: var(--accent2);
    box-shadow: 0 0 10px var(--accent2);
  }
  .cp-1 { width: 6px; height: 6px; top: 40%; left: 30%; animation: float 3s ease-in-out infinite alternate; }
  .cp-2 { width: 4px; height: 4px; top: 60%; left: 60%; animation: float 4s ease-in-out infinite alternate-reverse; }
  .cp-3 { width: 8px; height: 8px; top: 35%; left: 65%; animation: float 2.5s ease-in-out infinite alternate; opacity: 0.6; }

  /* Layer 2: Tracking lines following each other */
  .layer-2-lines {
    width: 450px;
    height: 450px;
    animation: spinRight 20s linear infinite;
  }
  .layer-2-lines svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .layer-2-lines circle {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    /* Asymmetrical dashes create the "following" effect */
    stroke-dasharray: 4 8 20 10 50 15 8 12;
    opacity: 0.6;
  }

  /* Layer 3: Thin, smooth hovering circle */
  .layer-3-ring {
    width: 650px;
    height: 650px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.02);
    animation: spinLeft 35s linear infinite;
  }

  /* Layer 4: Large outer orbit with different sized balls */
  .layer-4-outer {
    width: 900px;
    height: 900px;
    border: 1px solid rgba(0, 229, 255, 0.1);
    animation: spinRight 45s linear infinite;
  }
  
  /* Planets/Balls attached to Layer 4 */
  .planet {
    position: absolute;
    border-radius: 50%;
  }
  
  /* Large dark ball */
  .planet-1 {
    width: 60px;
    height: 60px;
    background: radial-gradient(circle at 30% 30%, #222, #000);
    border: 1px solid rgba(255, 255, 255, 0.1);
    top: -30px; /* Sits perfectly on the top edge */
    left: 50%;
    transform: translateX(-50%);
    box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.05);
  }
  
  /* Small bright glowing ball */
  .planet-2 {
    width: 16px;
    height: 16px;
    background: var(--accent);
    box-shadow: 0 0 20px var(--accent);
    top: 50%;
    right: -8px; /* Sits perfectly on the right edge */
    transform: translateY(-50%);
  }

  /* Medium hollow circle */
  .planet-3 {
    width: 30px;
    height: 30px;
    background: transparent;
    border: 2px solid var(--accent2);
    bottom: -15px; /* Sits perfectly on the bottom edge */
    left: 50%;
    transform: translateX(-50%);
  }

  /* Tiny distant dot */
  .planet-4 {
    width: 6px;
    height: 6px;
    background: #fff;
    box-shadow: 0 0 8px #fff;
    top: 20%;
    left: 4%;
  }

  /* Animations */
  @keyframes spinRight { 100% { transform: rotate(360deg); } }
  @keyframes spinLeft { 100% { transform: rotate(-360deg); } }
  @keyframes pulseCore { 
    0% { transform: scale(0.9); opacity: 0.7; } 
    100% { transform: scale(1.1); opacity: 1; } 
  }
  @keyframes float {
    0% { transform: translate(0, 0); }
    100% { transform: translate(15px, -15px); }
  }

  /* --- TEXT CONTENT (No Box) --- */
  .content-wrapper {
    position: relative;
    z-index: 10;
    text-align: center;
    max-width: 600px;
    padding: 20px;
    /* Heavy text shadow ensures readability against the glowing lines passing behind */
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 2px 5px rgba(0,0,0,0.8);
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 229, 255, 0.08);
    border: 1px solid rgba(0, 229, 255, 0.2);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 11px;
    color: var(--accent2);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 2rem;
    backdrop-filter: blur(4px); /* Slight blur just for the pill */
  }

  .tag::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--accent2);
    border-radius: 50%;
    animation: pulseTag 2s infinite;
  }

  @keyframes pulseTag {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(3rem, 6vw, 4.5rem);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin-bottom: 1.5rem;
  }

  .title span {
    color: var(--accent);
  }

  .description {
    color: #e0e0e0;
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 2.5rem;
    font-weight: 300;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.3s;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
  }

  .back-link:hover {
    color: var(--accent);
    gap: 14px;
    border-bottom: 1px solid var(--accent);
  }

  .back-link .arrow {
    font-size: 16px;
    transition: transform 0.3s;
  }
  
  .back-link:hover .arrow {
    transform: translateX(-4px);
  }
</style>
</head>
<body>

  <!-- Background Grid -->
  <div class="grid-overlay"></div>

  <!-- The 4-Layer Orbital System -->
  <div class="orbital-system">
    
    <!-- Layer 4: Outer track with planets -->
    <div class="orbit layer-4-outer">
      <div class="planet planet-1"></div>
      <div class="planet planet-2"></div>
      <div class="planet planet-3"></div>
      <div class="planet planet-4"></div>
    </div>

    <!-- Layer 3: Thin solid ring -->
    <div class="orbit layer-3-ring"></div>

    <!-- Layer 2: Following/dashed tracking lines (using SVG for perfect styling) -->
    <div class="orbit layer-2-lines">
      <svg viewBox="0 0 450 450">
        <circle cx="225" cy="225" r="224"></circle>
      </svg>
    </div>

    <!-- Layer 1: Core Ball with hovering stuff inside -->
    <div class="orbit layer-1-core">
      <div class="core-particle cp-1"></div>
      <div class="core-particle cp-2"></div>
      <div class="core-particle cp-3"></div>
    </div>

  </div>

  <!-- Main Content (Now completely transparent & centered inside the orbits) -->
  <div class="content-wrapper">
    <div class="tag">Agency Website</div>
    <h1 class="title">Under<br><span>Production</span></h1>
    <p class="description">
      High-converting marketing site with CMS integration and<br>98 PageSpeed score. Delivered in 5 days.
    </p>
    <a href="../index.html" class="back-link">
      <span class="arrow">←</span> Back to Portfolio
    </a>
  </div>

</body>
</html>

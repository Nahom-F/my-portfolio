<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Production</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #01030a;
    --white: #f4f7fb;
    --muted: #9aa5b7;
    --green: #00ff66;
  }

  html, body { width: 100%; height: 100%; }

  body {
    min-height: 100vh;
    overflow: hidden;
    position: relative;
    display: grid;
    place-items: center;
    color: var(--white);
    background:
      radial-gradient(circle at 50% 48%, rgba(0, 70, 105, .20), transparent 32%),
      radial-gradient(circle at 50% 50%, #07101b 0%, #02050b 42%, #000105 78%);
    font-family: 'DM Mono', monospace;
  }

  /* Very subtle space/energy atmosphere behind the artwork. */
  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    pointer-events: none;
    background:
      radial-gradient(circle at 18% 25%, rgba(0, 190, 255, .10) 0 1px, transparent 2px),
      radial-gradient(circle at 77% 19%, rgba(0, 220, 255, .12) 0 1px, transparent 2px),
      radial-gradient(circle at 84% 76%, rgba(0, 120, 255, .10) 0 1px, transparent 2px),
      radial-gradient(circle at 25% 78%, rgba(120, 0, 255, .10) 0 1px, transparent 2px);
    background-size: 260px 220px, 330px 280px, 390px 340px, 310px 270px;
    opacity: .65;
    animation: atmosphere 18s linear infinite;
  }

  .scene {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    perspective: 1400px;
  }

  /*
    LAYER 1 — OUTER SPHERE
    The actual purple sphere rotates as an image, so its internal
    texture/highlights move with it instead of only rotating a CSS circle.
  */
  .sphere-layer {
    position: absolute;
    width: min(94vmin, 980px);
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    opacity: .58;
    filter: saturate(1.18) contrast(1.08) brightness(.72);
    mix-blend-mode: screen;
    animation: sphereMove 42s linear infinite;
  }

  .sphere-layer::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow:
      inset 0 0 70px 24px rgba(0, 0, 0, .82),
      inset 0 0 22px 4px rgba(226, 112, 255, .42),
      0 0 70px rgba(119, 0, 255, .14);
  }

  .sphere-layer img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    animation: sphereTexture 24s ease-in-out infinite alternate;
  }

  /*
    LAYER 2 — DOT/DONUT ORBITS
    The supplied dotted rings rotate, drift and gently breathe.
  */
  .donut-layer {
    position: absolute;
    width: min(73vmin, 760px);
    aspect-ratio: 433 / 260;
    display: grid;
    place-items: center;
    mix-blend-mode: screen;
    opacity: .82;
    filter: brightness(1.45) contrast(1.12) drop-shadow(0 0 18px rgba(0, 190, 255, .28));
    animation: donutOrbit 17s linear infinite;
  }

  .donut-layer img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    animation: donutTilt 9s ease-in-out infinite alternate;
  }

  /*
    LAYER 3 — ATOMIC IMAGE
    This is the sharpest moving layer. The original image is cropped
    to remove its watermark strip, then animated as a complete image.
  */
  .atomic-layer {
    position: absolute;
    width: min(78vmin, 820px);
    aspect-ratio: 569 / 260;
    display: grid;
    place-items: center;
    mix-blend-mode: screen;
    opacity: .92;
    filter: brightness(1.20) saturate(1.15) contrast(1.08)
            drop-shadow(0 0 16px rgba(0, 194, 255, .25));
    animation: atomicOrbit 23s linear infinite;
  }

  .atomic-layer img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    animation: atomicFloat 5.5s ease-in-out infinite alternate;
  }

  /* A tiny central energy point ties the three image layers together. */
  .core {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: white;
    box-shadow:
      0 0 8px 3px #fff,
      0 0 22px 8px rgba(0, 236, 255, .95),
      0 0 55px 16px rgba(0, 130, 255, .42);
    z-index: 5;
    animation: corePulse 2.2s ease-in-out infinite alternate;
  }

  /* Foreground text. No extra UI/tag — only the requested content. */
  .content {
    position: relative;
    z-index: 20;
    width: min(680px, 92vw);
    padding: 30px;
    text-align: center;
    text-shadow: 0 5px 28px #000, 0 0 55px #000;
  }

  .title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(3.5rem, 9vw, 7.2rem);
    font-weight: 800;
    line-height: .88;
    letter-spacing: -.055em;
    color: var(--white);
    margin-bottom: 1.55rem;
  }

  .title span {
    color: var(--green);
  }

  .description {
    max-width: 620px;
    margin: 0 auto 2.35rem;
    color: var(--muted);
    font-size: clamp(12px, 1.5vw, 15px);
    line-height: 1.8;
    font-weight: 400;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    color: var(--white);
    border: 1px solid rgba(0, 255, 102, .34);
    border-radius: 999px;
    background: rgba(0, 255, 102, .035);
    box-shadow: 0 0 24px rgba(0, 0, 0, .35), inset 0 0 18px rgba(0, 255, 102, .025);
    font-size: 12px;
    letter-spacing: .09em;
    text-transform: uppercase;
    text-decoration: none;
    backdrop-filter: blur(8px);
    transition: .3s ease;
  }

  .back-link:hover {
    color: var(--green);
    border-color: rgba(0, 255, 102, .8);
    box-shadow: 0 0 22px rgba(0, 255, 102, .16), inset 0 0 18px rgba(0, 255, 102, .06);
    transform: translateY(-2px);
  }

  .arrow {
    font-size: 16px;
    transition: transform .3s ease;
  }

  .back-link:hover .arrow {
    transform: translateX(-4px);
  }

  @keyframes sphereMove {
    from { transform: rotate(0deg) scale(.985); }
    50% { transform: rotate(180deg) scale(1.015); }
    to { transform: rotate(360deg) scale(.985); }
  }

  @keyframes sphereTexture {
    from { transform: scale(1) rotate(-1deg); }
    to { transform: scale(1.045) rotate(1deg); }
  }

  @keyframes donutOrbit {
    from { transform: rotate(0deg) translate3d(0,0,0); }
    25% { transform: rotate(90deg) translate3d(1.5%, -1%, 0); }
    50% { transform: rotate(180deg) translate3d(0, 1.5%, 0); }
    75% { transform: rotate(270deg) translate3d(-1.5%, 0, 0); }
    to { transform: rotate(360deg) translate3d(0,0,0); }
  }

  @keyframes donutTilt {
    from { transform: rotateX(5deg) rotateY(-8deg) scale(.96); }
    to { transform: rotateX(-5deg) rotateY(8deg) scale(1.03); }
  }

  @keyframes atomicOrbit {
    from { transform: rotate(0deg) scale(.98); }
    to { transform: rotate(-360deg) scale(1.02); }
  }

  @keyframes atomicFloat {
    from { transform: translate3d(-1.2%, 1%, 0) rotate(-1deg); }
    to { transform: translate3d(1.2%, -1%, 0) rotate(1deg); }
  }

  @keyframes corePulse {
    from { transform: scale(.72); opacity: .72; }
    to { transform: scale(1.3); opacity: 1; }
  }

  @keyframes atmosphere {
    from { transform: translate3d(0,0,0) rotate(0deg); }
    to { transform: translate3d(2%, -1%, 0) rotate(360deg); }
  }

  @media (max-width: 700px) {
    .sphere-layer { width: 112vmin; opacity: .52; }
    .donut-layer { width: 92vmin; }
    .atomic-layer { width: 96vmin; }
    .content { padding: 22px; }
    .description { line-height: 1.65; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sphere-layer, .sphere-layer img, .donut-layer, .donut-layer img,
    .atomic-layer, .atomic-layer img, .core, body::before {
      animation-duration: 20s;
      animation-iteration-count: 1;
    }
  }
</style>
</head>
